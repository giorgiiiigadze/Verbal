name: Backend tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  entitlement:
    name: Entitlement and notification rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test notification state rules
        run: node supabase/functions/app-store-notifications/notification-state.test.mjs
      - name: Test verified-entitlement rules
        working-directory: supabase/functions/verify-subscription
        run: |
          npm ci
          node entitlement.test.mjs

  database:
    name: Database quota and subscription integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Self-hosted runners can retain a stopped or previous-run Supabase
      # database. Its published 54322 port prevents this job's clean stack
      # from starting, so remove only this project's known local container.
      - name: Clear stale local Supabase database
        run: docker rm -f supabase_db_rglpwlmkwukezvexyups || true
      # These are SQL-only tests: Postgres provides the schemas, extensions,
      # migrations, and pgTAP runner. Starting the API, Studio, functions, and
      # image services only adds Docker image pulls. setup-cli defaults to
      # GHCR, but GitHub-hosted runners are presently rate-limited there for
      # the public Supabase Postgres image. Use Docker Hub for this one-image
      # stack instead.
      - name: Start local Supabase database
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
        run: |
          for attempt in 1 2 3; do
            if supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            supabase stop --no-backup || true
            sleep $((attempt * 20))
          done
      - name: Apply migrations from scratch
        run: supabase db reset
      - name: Test quota and subscription integrity
        run: supabase test db supabase/tests/quota_and_integrity.sql --local
